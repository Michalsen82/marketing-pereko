name: Build PEREKO public documents

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/split_pereko_docs.py"
      - "scripts/inspect_pi_pdf.py"
      - ".github/workflows/build-pereko-docs.yml"

permissions:
  contents: write

jobs:
  build-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF library
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Inspect PI source PDF
        run: python scripts/inspect_pi_pdf.py

      - name: Download and split official PEREKO PDFs
        run: python scripts/split_pereko_docs.py

      - name: Commit generated PDFs
        run: |
          git config user.name "PEREKO Docs Builder"
          git config user.email "michal.bukowski@pereko.pl"
          git add docs/pereko-docs/pl
          if git diff --cached --quiet; then
            echo "No document changes to commit."
            exit 0
          fi
          git commit -m "Aktualizuj publiczne dokumenty PEREKO"
          git push
