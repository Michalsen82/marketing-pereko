<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEREKO — dokumenty techniczne</title>
<style>
:root{--yellow:#ffc800;--ink:#222b30;--muted:#69767d;--line:#dce2e5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2f3,#f7f8f8);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}.top{background:linear-gradient(135deg,#151b1e,#2e393e);padding:24px}.inner{width:min(1180px,calc(100% - 32px));margin:auto}.brand{display:flex;align-items:center;gap:16px;color:#fff}.logo{border:2px solid var(--yellow);color:var(--yellow);font-weight:900;font-size:22px;padding:10px 14px;letter-spacing:.04em}.brand b{display:block}.brand small{color:#b8c2c6}.main{padding:38px 0 60px}.tag{font-size:10px;font-weight:900;color:#7b6500;text-transform:uppercase;letter-spacing:.08em}.main h1{font-size:36px;letter-spacing:-.035em;margin:6px 0 8px}.lead{color:var(--muted);margin:0 0 28px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0;box-shadow:0 10px 30px rgba(35,43,47,.035)}.head{padding:18px 20px;border-bottom:1px solid #e4e8ea}.head h2{margin:0;font-size:19px}.files{padding:4px 20px}.file{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:13px 0;border-top:1px solid #edf0f1}.file:first-child{border-top:0}.file span{font-size:13px}.file a{text-decoration:none;background:var(--yellow);color:#20272b;font-size:11px;font-weight:900;border-radius:9px;padding:10px 13px;white-space:nowrap}@media(max-width:650px){.file{align-items:flex-start;flex-direction:column}.file a{width:100%;text-align:center}.main h1{font-size:28px}}
</style>
</head>
<body>
<header class="top"><div class="inner"><div class="brand"><div class="logo">PEREKO</div><div><b>Dokumenty techniczne</b><small>Publiczne pliki PDF · język polski</small></div></div></div></header>
<main class="main"><div class="inner"><span class="tag">PEREKO</span><h1>Dokumentacja urządzeń</h1><p class="lead">Oddzielne pliki dokumentacji techniczno-ruchowej oraz instrukcji sterowników. Pliki można bezpośrednio otwierać i pobierać.</p><div id="list"></div></div></main>
<script>
const docs=[
['QMPELL EVO',[['Dokumentacja techniczno-ruchowa','pl/qmpell-evo-dtr-pl.pdf'],['Instrukcja sterownika ecoMAX 920P1 TOUCH','pl/qmpell-evo-sterownik-ecomaxx-920p1-touch-pl.pdf']]],
['QMPELL DUO',[['Dokumentacja techniczno-ruchowa','pl/qmpell-duo-dtr-pl.pdf'],['Instrukcja sterownika ecoMAX 920P1 TOUCH','pl/qmpell-duo-sterownik-ecomaxx-920p1-touch-pl.pdf']]],
['COMFORT-PELL',[['Dokumentacja techniczno-ruchowa','pl/comfort-pell-dtr-pl.pdf'],['Instrukcja sterownika ecoMAX860P3-C TOUCH','pl/comfort-pell-sterownik-ecomax860p3-c-touch-pl.pdf']]],
['SPARK EVO',[['Dokumentacja techniczno-ruchowa','pl/spark-evo-dtr-pl.pdf'],['Instrukcja obsługi zintegrowanego sterowania','pl/spark-evo-instrukcja-sterowania-pl.pdf']]],
['PELL-STAR',[['Dokumentacja techniczno-ruchowa','pl/pell-star-dtr-pl.pdf'],['Instrukcja sterownika TECH ST-976','pl/pell-star-sterownik-st-976-pl.pdf']]],
['PELL-STAR PRO',[['Dokumentacja techniczno-ruchowa','pl/pell-star-pro-dtr-pl.pdf'],['Instrukcja sterownika TECH ST-976','pl/pell-star-pro-sterownik-st-976-pl.pdf']]],
['RETRO DUO',[['Dokumentacja techniczno-ruchowa','pl/retro-duo-dtr-pl.pdf']]],
['RETRO',[['Dokumentacja techniczno-ruchowa','pl/retro-dtr-pl.pdf']]],
['KARBO',[['Dokumentacja techniczno-ruchowa','pl/karbo-dtr-pl.pdf']]],
['KSM',[['Dokumentacja techniczno-ruchowa','pl/ksm-dtr-pl.pdf'],['Instrukcja sterownika ecoMAX 910R1','pl/ksm-sterownik-ecomax-910r1-pl.pdf']]],
['PI',[['Dokumentacja techniczno-ruchowa','pl/pi-dtr-pl.pdf'],['Instrukcja sterownika IE-80v1 · 3,2 kW','pl/pi-sterownik-ie-80v1-pl.pdf'],['Instrukcja sterownika PX100 · 10/21 kW','pl/pi-sterownik-px100-pl.pdf']]],
['SONIC',[['Dokumentacja techniczno-ruchowa','pl/sonic-dtr-pl.pdf'],['Instrukcja sterownika PX100','pl/sonic-sterownik-px100-pl.pdf']]],
['TERMOSTAR PRO',[['DTR · 6–18 kW','pl/termostar-pro-6-18-dtr-pl.pdf'],['DTR · 19–28 kW','pl/termostar-pro-19-28-dtr-pl.pdf'],['DTR · 38–48 kW','pl/termostar-pro-38-48-dtr-pl.pdf'],['Instrukcja sterownika PX300','pl/termostar-pro-sterownik-px300-pl.pdf']]]
];
document.getElementById('list').innerHTML=docs.map(([name,files])=>`<section class="card"><div class="head"><h2>${name}</h2></div><div class="files">${files.map(([label,url])=>`<div class="file"><span>${label}</span><a href="${url}" target="_blank" rel="noopener">Otwórz PDF</a></div>`).join('')}</div></section>`).join('');
</script>
</body></html>
