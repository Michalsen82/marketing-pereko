<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Offline — PEREKO Marketing</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:24px}.card{width:min(480px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);background:#101214}.mark{width:46px;height:46px;display:grid;place-items:center;background:#ffdd00;color:#111;font-weight:900;font-size:24px;margin-bottom:20px}.eyebrow{color:#ffdd00;font-size:11px;font-weight:800;letter-spacing:.12em}.card h1{font-size:26px;margin:9px 0}.card p{color:rgba(255,255,255,.65);line-height:1.55;font-size:14px}.card button{height:42px;border:1px solid #e0c500;background:#ffdd00;color:#111;padding:0 16px;font-weight:800;cursor:pointer;border-radius:5px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">P</div>
    <div class="eyebrow">CENTRUM MARKETINGOWE</div>
    <h1>Brak połączenia z siecią</h1>
    <p>Aplikacja zachowała podstawowy interfejs. Dane centralne zostaną ponownie pobrane po odzyskaniu połączenia.</p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
  </main>
</body>
</html>
