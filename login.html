<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Logowanie — Centrum Projektów Marketingowych PEREKO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard-polish.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="mobile-responsive.css" />
</head>
<body>
  <main class="login-minimal-page">
    <section class="login-minimal-wrap">
      <div class="login-brand-center">
        <div class="brand-zone">
          <div class="brand-badge">P</div>
          <div class="brand-copy">
            <strong>PEREKO</strong>
            <span>Centrum Projektów Marketingowych</span>
          </div>
        </div>
      </div>

      <section class="login-panel-minimal">
        <div class="login-card-head">
          <span>BEZPIECZNY DOSTĘP</span>
          <h2>Zaloguj się</h2>
          <p>Użyj firmowego adresu e-mail i hasła.</p>
        </div>

        <form id="loginForm" novalidate>
          <label>
            <span>Adres e-mail</span>
            <input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="imie.nazwisko@pereko.pl" required />
          </label>
          <label>
            <span>Hasło</span>
            <div class="password-field">
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Wpisz hasło" required />
              <button id="togglePassword" type="button" aria-label="Pokaż lub ukryj hasło">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5.5 0 9.5 5.1 9.5 7s-4 7-9.5 7S2.5 13.9 2.5 12 6.5 5 12 5Zm0 2C8.2 7 5 10.4 4.6 12 5 13.6 8.2 17 12 17s7-3.4 7.4-5C19 10.4 15.8 7 12 7Zm0 2.5A2.5 2.5 0 1 1 12 14.5 2.5 2.5 0 0 1 12 9.5Z"/></svg>
              </button>
            </div>
          </label>

          <button class="login-submit" type="submit">Zaloguj się</button>
          <button class="login-forgot" type="button" id="forgotPassword">Nie pamiętasz hasła?</button>
          <div class="login-message" id="loginMessage" role="status" aria-live="polite"></div>
        </form>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n  <script src="login.js"></script>
</body>
</html>
