<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <meta name="application-name" content="PEREKO Marketing" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEREKO Marketing" />
  <script>
    try{
      var __perekoTheme=localStorage.getItem('pereko_theme')||'dark';
      document.documentElement.dataset.theme=__perekoTheme;
      document.documentElement.style.colorScheme=__perekoTheme;
    }catch(e){}
    window.__perekoInstallPrompt=null;
    window.addEventListener('beforeinstallprompt',function(event){
      event.preventDefault();
      window.__perekoInstallPrompt=event;
      window.dispatchEvent(new Event('pereko:install-prompt-ready'));
    });
    window.addEventListener('appinstalled',function(){window.__perekoInstallPrompt=null;});
  </script>
  <link rel="manifest" href="/manifest.webmanifest?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/pereko-marketing-v3-apple.png" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <title>25-lecie marki PEREKO — Karta projektu</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard-polish.css" />
  <link rel="stylesheet" href="footer.css?v=2" />
  <link rel="stylesheet" href="dark-glass.css?v=2" />
  <link rel="stylesheet" href="team.css" />
  <link rel="stylesheet" href="user-avatar.css?v=4" />
  <link rel="stylesheet" href="account-security.css" />
  <link rel="stylesheet" href="pwa.css?v=12" />
  <link rel="stylesheet" href="sharp-corners.css" />
  <link rel="stylesheet" href="light-theme.css?v=23" />
  <link rel="stylesheet" href="stability-pass.css?v=9" />
  <style>
    .anniversary-project-page{min-height:calc(100dvh - 88px);display:flex;flex-direction:column}
    .anniversary-project-empty{width:min(1400px,calc(100% - 48px));margin:0 auto;flex:1;min-height:520px}
    .anniversary-brand-link{text-decoration:none}
    @media(max-width:900px){.anniversary-project-empty{width:calc(100% - 32px)}}
    @media(max-width:620px){.anniversary-project-empty{width:calc(100% - 24px);min-height:420px}}
  </style>
</head>
<body style="visibility:hidden">
  <div class="anniversary-project-page">
    <header class="topbar-shell">
      <div class="topbar">
        <a class="brand-zone anniversary-brand-link" href="index.html" aria-label="Wróć do Centrum Projektów Marketingowych">
          <div class="brand-badge">P</div>
          <div class="brand-copy">
            <strong>PEREKO</strong>
            <span>Centrum Projektów Marketingowych</span>
          </div>
        </a>
        <div class="topbar-actions">
          <button class="theme-toggle-btn top-action-icon" id="themeToggle" type="button" data-tooltip="Przełącz motyw" aria-label="Przełącz na jasny motyw" aria-pressed="false">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0-6h1v4h-2V2h1Zm0 16h1v4h-2v-4h1ZM2 11h4v2H2v-2Zm16 0h4v2h-4v-2ZM4.22 5.64l1.42-1.42 2.83 2.83-1.42 1.42-2.83-2.83Zm11.31 11.31 1.42-1.42 2.83 2.83-1.42 1.42-2.83-2.83Zm0-9.9 2.83-2.83 1.42 1.42-2.83 2.83-1.42-1.42ZM4.22 18.36l2.83-2.83 1.42 1.42-2.83 2.83-1.42-1.42Z"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 9 9 0 1 0 20.2 15.3ZM12 20a7 7 0 0 1-5.8-10.9A10.5 10.5 0 0 0 14.9 17.8 7 7 0 0 1 12 20Z"/></svg>
          </button>
          <button class="team-top-btn top-action-icon" id="teamTopBtn" type="button" data-tooltip="Zespół i współpracownicy" aria-label="Zespół i współpracownicy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19.5C2 15.91 4.91 13 8.5 13S15 15.91 15 19.5V21H2v-1.5Zm13.1-6.38A6.96 6.96 0 0 1 17 18v3h5v-1.25c0-3.1-2.52-5.63-5.63-5.63-.44 0-.86.05-1.27.14Z"/></svg>
          </button>
          <button class="password-change-btn top-action-icon" id="changePasswordBtn" type="button" data-tooltip="Zmień hasło" aria-label="Zmień hasło">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 1 5 5v2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h1V7a5 5 0 0 1 5-5Zm3 7V7a3 3 0 0 0-6 0v2h6Zm-3 4a2 2 0 0 0-1 3.73V19h2v-2.27A2 2 0 0 0 12 13Z"/></svg>
          </button>
          <a class="logout-btn top-action-icon" id="logoutBtn" href="login.html" data-tooltip="Wyloguj" aria-label="Wyloguj">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8v-2h8V5h-8V3Zm1.4 5.4L10 7l-5 5 5 5 1.4-1.4L8.8 13H16v-2H8.8l2.6-2.6Z"/></svg>
          </a>
          <div class="user-zone" aria-label="Zalogowany użytkownik">
            <div class="user-zone-copy">
              <strong id="loggedUserName">Michał Bukowski</strong>
              <span>Zalogowany użytkownik</span>
            </div>
            <label class="user-avatar-control" for="userAvatarInput" title="Dodaj lub zmień zdjęcie">
              <span class="user-avatar-circle" id="userAvatarCircle">
                <img id="userAvatarImg" alt="Zdjęcie użytkownika" />
                <span class="user-avatar-placeholder" id="userAvatarPlaceholder" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
                </span>
              </span>
              <span class="user-avatar-plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4.5 10.2 3h3.6L15 4.5h3A2.5 2.5 0 0 1 20.5 7v10A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17V7A2.5 2.5 0 0 1 6 4.5h3ZM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg></span>
            </label>
            <input type="file" id="userAvatarInput" accept="image/*" hidden />
          </div>
        </div>
      </div>
    </header>

    <main class="anniversary-project-empty" aria-label="Karta projektu 25-lecie marki PEREKO"></main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <div class="footer-brand">
          <div class="footer-logo" aria-hidden="true"></div>
          <div class="footer-copy">
            <strong>Centrum Projektów Marketingowych</strong>
            <span>Planowanie, realizacja i kontrola działań marketingowych PEREKO</span>
            <small class="footer-author">Zaprojektował i wykonał Michał Bukowski</small>
          </div>
        </div>
        <div class="footer-actions">
          <div class="footer-status-btn" data-state="ok" role="status">
            <span class="footer-status-dot"></span>
            <span>Karta projektu</span>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <script src="light-theme.js?v=1"></script>
  <script src="team.js"></script>
  <script src="user-avatar.js"></script>
  <script src="account-security.js"></script>
  <script src="pwa.js?v=18"></script>
  <script src="footer.js?v=2"></script>
</body>
</html>
