<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <meta name="application-name" content="PEREKO Marketing" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEREKO Marketing" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
<title>Ustaw nowe hasło — PEREKO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="mobile-responsive.css" />
  <link rel="stylesheet" href="pwa.css" />
  <link rel="stylesheet" href="sharp-corners.css" />
</head>
<body>
  <main class="login-minimal-page">
    <section class="login-minimal-wrap">
      <div class="login-brand-center"><div class="brand-zone"><div class="brand-badge">P</div><div class="brand-copy"><strong>PEREKO</strong><span>Centrum Projektów Marketingowych</span></div></div></div>
      <section class="login-panel-minimal">
        <div class="login-card-head"><span>ODZYSKIWANIE DOSTĘPU</span><h2>Ustaw nowe hasło</h2><p>Wpisz nowe hasło do swojego konta.</p></div>
        <form id="resetForm">
          <label><span>Nowe hasło</span><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 znaków"></label>
          <label><span>Powtórz nowe hasło</span><input id="resetPassword2" type="password" autocomplete="new-password" minlength="8" required placeholder="Powtórz nowe hasło"></label>
          <button class="login-submit" type="submit">Ustaw nowe hasło</button>
          <div class="login-message" id="resetMessage" role="status" aria-live="polite"></div>
        </form>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
